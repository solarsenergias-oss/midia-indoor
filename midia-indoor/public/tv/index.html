<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Player - Mídia Indoor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; color: #fff; font-family: Arial, sans-serif; }
        .player { width: 100%; height: 100vh; display: flex; flex-direction: column; }
        video { width: 100%; height: 100%; object-fit: contain; }
        .status { position: fixed; top: 10px; right: 10px; padding: 10px 20px; background: rgba(0,0,0,0.7); border-radius: 4px; }
        .online { color: #4ade80; }
        .offline { color: #ef4444; }
    </style>
</head>
<body>
    <div class="player">
        <video id="video" autoplay></video>
        <div class="status">
            <span id="status-text" class="offline">● Offline</span>
        </div>
    </div>
    <script>
        console.log('📺 TV Player iniciado');
        
        // Register Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(reg => {
                console.log('✅ Service Worker registered');
            }).catch(err => console.error('❌ SW registration failed', err));
        }

        // Update status
        function updateStatus() {
            const online = navigator.onLine;
            document.getElementById('status-text').textContent = online ? '● Online' : '● Offline';
            document.getElementById('status-text').className = online ? 'online' : 'offline';
        }

        window.addEventListener('online', updateStatus);
        window.addEventListener('offline', updateStatus);
        updateStatus();
    </script>
</body>
</html>
