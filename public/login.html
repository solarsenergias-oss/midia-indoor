<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar - VizzoPlay</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%236C5CE0'/%3E%3Cstop offset='100%25' stop-color='%2322B8A0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M18 8 L90 50 L18 92 Z' fill='url(%23g)'/%3E%3Cellipse cx='40' cy='50' rx='17' ry='11' fill='%23fff'/%3E%3Ccircle cx='40' cy='50' r='6.5' fill='%231a1d24'/%3E%3C/svg%3E">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    background: #0f1115;
    color: #fff;
    min-height: 100vh;
    display: flex;
  }
  .login-side {
    width: 460px;
    max-width: 92vw;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 60px;
    flex-shrink: 0;
  }
  .logo {
    width: 56px; height: 56px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 28px;
  }
  h1 { font-size: 26px; font-weight: 800; margin-bottom: 32px; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: #d1d5db; }
  .field { margin-bottom: 18px; }
  input[type=email], input[type=password] {
    width: 100%;
    padding: 13px 16px;
    background: #1a1d24;
    border: 1px solid #2a2f3a;
    border-radius: 10px;
    color: #fff;
    font-size: 14px;
    outline: none;
    transition: border-color .15s ease;
  }
  input:focus { border-color: #6C5CE0; }
  .pw-wrap { position: relative; }
  .pw-toggle { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #9ca3af; font-size: 16px; background: none; border: none; }
  .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; font-size: 13px; }
  .remember { display: flex; align-items: center; gap: 8px; color: #d1d5db; }
  .forgot { color: #22B8A0; font-weight: 600; }
  .btn-login {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg,#6C5CE0,#22B8A0);
    border: none;
    border-radius: 10px;
    color: #fff;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    transition: opacity .15s ease;
  }
  .btn-login:hover { opacity: .9; }
  .btn-login:disabled { opacity: .6; cursor: not-allowed; }
  .signup { text-align: center; margin-top: 20px; font-size: 13px; color: #9ca3af; }
  .signup a { color: #22B8A0; font-weight: 700; }
  .error-msg {
    background: rgba(220,38,38,0.12);
    border: 1px solid #dc2626;
    color: #fca5a5;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 16px;
    display: none;
  }
  .footer-link { text-align: center; margin-top: 60px; font-size: 12px; color: #6b7280; }

  .image-side {
    flex: 1;
    position: relative;
    background: linear-gradient(135deg, rgba(108,92,224,0.85), rgba(34,184,160,0.85)),
                url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800"><rect width="800" height="800" fill="%23111"/></svg>');
    background-size: cover;
    display: flex;
    align-items: flex-end;
    padding: 60px;
  }
  .image-side::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.08), transparent 60%);
  }
  .quote { position: relative; max-width: 420px; z-index: 1; }
  .quote h2 { font-size: 24px; font-weight: 800; margin-bottom: 10px; }
  .quote p { font-size: 14px; opacity: .9; line-height: 1.6; }

  @media (max-width: 800px) {
    .image-side { display: none; }
    .login-side { width: 100%; }
  }
</style>
</head>
<body>
  <div class="login-side">
    <div class="logo">
      <svg viewBox="0 0 100 100" width="48" height="48" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="vizzoGradLogin" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#6C5CE0"/>
            <stop offset="100%" stop-color="#22B8A0"/>
          </linearGradient>
        </defs>
        <path d="M18 8 L90 50 L18 92 Z" fill="url(#vizzoGradLogin)"/>
        <ellipse cx="40" cy="50" rx="17" ry="11" fill="#fff"/>
        <circle cx="40" cy="50" r="6.5" fill="#1a1d24"/>
      </svg>
    </div>
    <h1>Entre na sua conta</h1>

    <div class="error-msg" id="errorMsg"></div>

    <form id="loginForm">
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" placeholder="seuemail@provedor.com.br" required>
      </div>
      <div class="field">
        <label>Senha</label>
        <div class="pw-wrap">
          <input type="password" id="senha" placeholder="••••••••" required>
          <button type="button" class="pw-toggle" id="togglePw">👁️</button>
        </div>
      </div>
      <div class="row">
        <label class="remember">
          <input type="checkbox" checked> Manter conectado
        </label>
        <a href="#" class="forgot">Esqueci a senha</a>
      </div>
      <button type="submit" class="btn-login" id="btnLogin">Entrar</button>
    </form>

    <div class="footer-link">VizzoPlay · uso interno</div>
  </div>

  <div class="image-side">
    <div class="quote">
      <h2>Sua rede de telas, sob controle total.</h2>
      <p>Gerencie campanhas e monitore suas telas em tempo real com o VizzoPlay.</p>
    </div>
  </div>

<script>
  const form = document.getElementById('loginForm');
  const errorMsg = document.getElementById('errorMsg');
  const btnLogin = document.getElementById('btnLogin');

  document.getElementById('togglePw').addEventListener('click', () => {
    const pw = document.getElementById('senha');
    pw.type = pw.type === 'password' ? 'text' : 'password';
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.style.display = 'none';
    btnLogin.disabled = true;
    btnLogin.textContent = 'Entrando...';

    const email = document.getElementById('email').value;
    const senha = document.getElementById('senha').value;

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, senha }),
      });
      const data = await res.json();

      if (!res.ok) {
        errorMsg.textContent = data.error || 'Email ou senha inválidos';
        errorMsg.style.display = 'block';
        btnLogin.disabled = false;
        btnLogin.textContent = 'Entrar';
        return;
      }

      window.location.href = '/';
    } catch (err) {
      errorMsg.textContent = 'Erro ao conectar com o servidor';
      errorMsg.style.display = 'block';
      btnLogin.disabled = false;
      btnLogin.textContent = 'Entrar';
    }
  });
</script>
</body>
</html>
