<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VizzoPlay - Painel</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/brand/icon-192.png">
<link rel="apple-touch-icon" href="/assets/brand/icon-180.png">
<link rel="stylesheet" href="/admin/css/style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
</head>
<body>
<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">
        <img src="/assets/brand/icon-64.png" width="24" height="24" alt="VizzoPlay">
      </div>
      <div>
        <div class="logo-text">VizzoPlay</div>
        <div class="logo-sub">Digital Signage</div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section-title">Principal</div>
      <a class="nav-item" data-view="dashboard"><span class="icon">📊</span><span class="nav-label">Dashboard</span></a>
      <a class="nav-item" data-view="telas"><span class="icon">📺</span><span class="nav-label">Minhas Telas</span></a>
      <a class="nav-item" data-view="campanhas"><span class="icon">📢</span><span class="nav-label">Campanhas</span></a>

      <div class="nav-item" id="conteudosToggle" style="cursor:pointer;">
        <span class="icon">🖼️</span><span class="nav-label">Conteúdos</span> <span style="margin-left:auto;font-size:11px;transition:transform .15s ease;" id="conteudosChevron">▾</span>
      </div>
      <div id="conteudosSubmenu" style="display:none;padding-left:16px;">
        <a class="nav-item" data-view="midias"><span class="icon">🎞️</span><span class="nav-label">Minhas mídias</span></a>
        <a class="nav-item" data-view="grupos"><span class="icon">🗂️</span><span class="nav-label">Vincular telas</span></a>
        <a class="nav-item" data-view="conteudos-dinamicos"><span class="icon">⚡</span><span class="nav-label">Conteúdos dinâmicos</span></a>
        <a class="nav-item" data-view="instagram"><span class="icon">📷</span><span class="nav-label">Instagram</span></a>
        <a class="nav-item" data-view="rss"><span class="icon">📡</span><span class="nav-label">RSS Personalizado</span></a>
        <a class="nav-item" data-view="avisos"><span class="icon">🔔</span><span class="nav-label">Avisos</span></a>
        <a class="nav-item" data-view="utilitarios"><span class="icon">🧰</span><span class="nav-label">Utilitários</span></a>
      </div>

      <div class="nav-section-title">Negócio</div>
      <a class="nav-item" data-view="clientes"><span class="icon">👥</span><span class="nav-label">Clientes</span></a>
      <a class="nav-item" data-view="relatorios"><span class="icon">📈</span><span class="nav-label">Relatórios</span></a>
    </nav>

    <div class="sidebar-footer">
      <div class="footer-icons" id="footerIcons">
        <button class="btn-icon" title="Usuários" onclick="toast('Gerenciamento de usuários em breve')">👥</button>
        <button class="btn-icon" title="Notificações" onclick="toast('Nenhuma notificação nova')">🔔</button>
        <button class="btn-icon" id="themeToggle" title="Alternar tema">🌙</button>
        <button class="btn-icon" title="Sair" onclick="logout()">🚪</button>
      </div>
      <div class="user-menu" onclick="openMinhaContaModal()" style="cursor:pointer;">
        <div class="user-avatar" id="userAvatar">M</div>
        <div class="user-info">
          <div class="user-name" id="userName">Marcos</div>
          <div class="user-email" id="userEmail">solarsenergias@gmail.com</div>
        </div>
      </div>
      <button class="btn-icon" id="collapseToggle" title="Expandir menu" style="width:100%;margin-top:8px;border:1px solid var(--border);border-radius:var(--radius-sm);">⊟</button>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <div>
        <div class="breadcrumb" id="breadcrumb">Home</div>
        <div class="page-title" id="pageTitle">Dashboard</div>
      </div>
      <div class="topbar-actions" id="topbarActions"></div>
    </div>

    <div class="content" id="content">
      <div class="loader"></div>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>
<div class="modal-overlay" id="modalRoot"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="/admin/js/app.js"></script>
</body>
</html>
