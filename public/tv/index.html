<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mídia Indoor - TV Player</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #000; color: #fff; }
    .player { width: 100vw; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    .content { text-align: center; }
    h1 { font-size: 48px; margin-bottom: 20px; color: #00ff88; }
    p { font-size: 24px; color: #aaa; }
    .status { position: absolute; top: 20px; right: 20px; padding: 10px 20px; background: #00ff88; color: #000; border-radius: 4px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="player">
    <div class="status">🟢 ONLINE</div>
    <div class="content">
      <h1>📺 Mídia Indoor</h1>
      <p>TV Player Pronto para Exibir Campanhas</p>
      <p style="margin-top: 30px; font-size: 18px; color: #666;">Aguardando conexão com o servidor...</p>
    </div>
  </div>
</body>
</html>
